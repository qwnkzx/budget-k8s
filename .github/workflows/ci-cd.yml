name: Build and Push for GitOps
on:
  push:
    branches: ["main"]
    paths-ignore:
      - 'budget-chart/**'
      - 'README.md'
      - 'photo/**'

env:
  DOCKER_USER: bubuls

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lint Backend 
        run: | 
          pip install ruff
          ruff check backend/ || true 

      - name: Lint frontend 
        run: npx --yes @biomejs/biome lint frontend/ || true


  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: set short sha 
        run: echo "SHORT_SHA=${GITHUB::5}" >> $GITHUB_ENV

      - name: Login into Docker hub 
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ env.DOCKER_USER }}" --password-stdin
      
      - name: Build and Push Backend to Registry 
        run: |
          docker build -t ${{ env.DOCKER_USER }}/backend:${{ env.SHORT_SHA }} ./backend
          docker push ${{ env.DOCKER_USER }}/backend:${{ env.SHORT_SHA }}
      
      - name: Build and Push Frontend to Registry 
        run: | 
          docker build -t ${{ env.DOCKER_USER }}/frontend:${{ env.SHORT_SHA }} ./frontend
          docker push ${{ env.DOCKER_USER }}/frontend:${{ env.SHORT_SHA }}
  
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Say Hello
        run: echo "Hello"
  