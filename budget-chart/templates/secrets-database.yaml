apiVersion: v1 
kind: Secret
metadata:
  name: postgres-secret
  namespace: backend 
type: Opaque
stringData:
  POSTGRES_USER: budgetflow
  POSTGRES_PASSWORD: dev_password_change_me
  POSTGRES_DB: budgetflow
  POSTGRES_HOST: postgresql-state
  DB_HOST: postgresql-state
  JWT_SECRET: "replace-with-a-long-random-secret"
  DATABASE_URL: "postgresql+psycopg://budgetflow:dev_password_change_me@postgresql-state:5432/budgetflow"