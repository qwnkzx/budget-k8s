{{- range $name, $config := .Values.services}}
---
apiVersion: v1 
kind: Service 
metadata:
  name: {{ $config.name  }}
  namespace: {{ $config.namespace}}
spec:
  type: {{ $config.type }}
  selector:
    app: {{ $config.app }}
  ports:
    - port: {{ $config.external_port }}
      targetPort: {{ $config.interior_port }}
      protocol: TCP
{{- end}}