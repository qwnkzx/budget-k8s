apiVersion: apps/v1 
kind: StatefulSet
metadata:
  name: {{ .Values.db.name }}
  namespace: {{ .Values.db.namespace }}
spec:
  serviceName: {{ .Values.db.name }}
  replicas: {{ .Values.db.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Values.db.sec_name }}
  template:
    metadata:
      labels:
        app: {{ .Values.db.sec_name }}
    spec:
      containers:
        - name: {{ .Values.db.cont_name }}
          image: {{ .Values.db.image }}
          ports:
            - containerPort: {{ .Values.db.port }}
          envFrom:
            - secretRef:
                name: {{ .Values.db.secret_name }}
          env:
            - name: PGDATA
              value: {{ .Values.db.pg_data_path }}
          volumeMounts:
            - name: data-store
              mountPath: {{ .Values.db.pg_data_path }}
  volumeClaimTemplates:
    - metadata:
        name: data-store
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ .Values.db.storage }}